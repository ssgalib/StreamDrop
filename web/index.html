<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamDrop</title>
  </head>
  <body>
    <main>
      <h1>StreamDrop</h1>

      <section id="start">
        <button id="create" type="button">Create Room</button>
        <form id="join-form">
          <label>Room token <input id="token-input" required autocomplete="off"></label>
          <button>Join Room</button>
        </form>
      </section>

      <section id="room" hidden>
        <p id="share" hidden>Share this token: <code id="token"></code></p>
        <div id="sender" hidden>
          <label>File <input type="file" id="file" disabled></label>
        </div>
        <div id="offer" hidden>
          <p>Incoming file: <strong id="offer-name"></strong> (<span id="offer-size"></span>)</p>
          <button id="accept" type="button">Accept</button>
          <button id="decline" type="button">Decline</button>
        </div>
        <div id="transfer" hidden>
          <progress id="progress" value="0" max="1"></progress> <span id="pct">0%</span>
          <button id="cancel" type="button">Cancel</button>
        </div>
      </section>

      <p id="status" role="status">Not connected</p>
      <p id="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
