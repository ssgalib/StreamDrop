x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  signaling:
    build: ./server
    restart: unless-stopped
    logging: *logging

  caddy:
    build: ./web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
