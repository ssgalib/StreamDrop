# Behind the Cloudflare Tunnel: cloudflared forwards to nginx on 127.0.0.1:80, so $remote_addr is
# always local and the real visitor address is in CF-Connecting-IP.
map $http_cf_connecting_ip $streamdrop_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name streamdrop.kurohane.xyz;

    root /var/www/streamdrop;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://streamdrop.kurohane.xyz; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location = /ws {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Replaces any client-supplied value; the per-IP limit in the Go server trusts this header.
        proxy_set_header X-Forwarded-For $streamdrop_client_ip;
        proxy_read_timeout 1h;
    }

    # Stored mode: 8 MiB encrypted chunks. Buffering is off so nginx never spools them to the shared disk.
    location ^~ /store {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $streamdrop_client_ip;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
